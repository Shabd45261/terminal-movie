<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CloudX Player</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { background: #000; display: flex; flex-direction: column; height: 100vh; }
  #bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: #11141c; border-bottom: 1px solid #232a3c;
  }
  #bar .brand { font-size: 17px; margin-right: auto; }
  #status { font-size: 12px; color: var(--muted); }
  #status b { color: #7ee787; }
  .q { display: flex; gap: 6px; }
  .q button {
    background: var(--card); border: 1px solid #2a3143; color: var(--text);
    padding: 7px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
  }
  .q button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #player-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; max-height: 100vh; outline: none; }
  #err { color: #e06666; padding: 30px; text-align: center; }
</style>
</head>
<body>
<div id="bar">
  <div class="brand">CloudX<span>Movies</span> · Player</div>
  <span id="status">loading...</span>
  <div class="q" id="quality"></div>
</div>
<div id="player-wrap"><video id="video" controls autoplay></video></div>
<div id="err" class="hidden"></div>
<script src="/static/player.js"></script>
</body>
</html>
